<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025 Season — Maria vs Danielle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
      color: #1C1C1E;
      min-height: 100vh;
      padding: 48px 24px 80px;
    }

    .wrap { max-width: 640px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      font-size: 13px;
      color: #9CA3AF;
      text-decoration: none;
      margin-bottom: 32px;
    }
    .back-link:hover { color: #6B7280; }

    .season-header { text-align: center; margin-bottom: 32px; }
    .season-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .season-subtitle { font-size: 14px; color: #9CA3AF; }

    .vs-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 28px;
    }

    .player { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .player .player-name { font-size: 16px; font-weight: 600; }
    .maria .player-name { color: #B45309; }
    .danielle .player-name { color: #1D4ED8; }
    .vs-badge { font-size: 20px; font-weight: 700; color: #D1D5DB; }

    .winner-banner {
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 32px;
      font-size: 14px;
      font-weight: 500;
    }
    .winner-banner.maria-wins { background: #FEF3C7; color: #B45309; }
    .winner-banner.danielle-wins { background: #DBEAFE; color: #1D4ED8; }
    .winner-banner.tied { background: #F3F4F6; color: #6B7280; }
    .winner-name { font-size: 24px; font-weight: 700; display: block; margin-bottom: 4px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #F9FAFB;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .stat-card .s-label { font-size: 11px; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .stat-card .s-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .stat-card .s-val { font-size: 20px; font-weight: 700; }
    .stat-card .s-name { font-size: 11px; color: #9CA3AF; }
    .s-val.maria { color: #B45309; }
    .s-val.danielle { color: #1D4ED8; }

    .divider { border: none; border-top: 0.5px solid #E5E7EB; margin: 24px 0; }

    .fun-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 11px 0;
      border-bottom: 0.5px solid #F3F4F6;
      font-size: 13px;
      gap: 16px;
    }
    .fun-row:last-child { border-bottom: none; }
    .fun-label { color: #6B7280; flex-shrink: 0; max-width: 200px; }
    .fun-val { font-weight: 600; text-align: right; }
    .fun-val.maria { color: #B45309; }
    .fun-val.danielle { color: #1D4ED8; }
    .fun-val.red { color: #DC2626; }

    .loading { color: #9CA3AF; font-size: 14px; text-align: center; padding: 48px; }

    footer {
      font-size: 12px;
      color: #D1D5DB;
      margin-top: 48px;
      border-top: 0.5px solid #E5E7EB;
      padding-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="back-link">← Back to 2026</a>

    <div class="season-header">
      <div class="season-title">2025 Season</div>
      <div class="season-subtitle">Final results</div>
    </div>

    <div class="vs-row">
      <div class="player maria"><div class="player-name">Maria</div></div>
      <div class="vs-badge">VS</div>
      <div class="player danielle"><div class="player-name">Danielle</div></div>
    </div>

    <div id="main-content"><div class="loading">Loading...</div></div>

    <footer>Data pulled from Google Sheets · Refresh to update</footer>
  </div>

  <script src="config.js"></script>
  <script>
    var SHEET_2025 = '1DWLYS9RYuOv97ajIcsak69Z97ODtegnBXvlDKJgpwYc';
    var KEY = CONFIG.API_KEY;

    function fetchData() {
      var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_2025 + '/values/' + encodeURIComponent('Winnings!A1:R200') + '?key=' + KEY;
      return fetch(url).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function(data) {
        return data.values || [];
      });
    }

    function init() {
      fetchData().then(function(allRows) {
        var rows = allRows.slice(1).filter(function(r) {
          return r[0] && r[3] && r[3].trim() !== 'John';
        });

        var mCorrect = 0, mTotal = 0, dCorrect = 0, dTotal = 0;
        var mUnits = 0, dUnits = 0, mDollars = 0, dDollars = 0;
        var pickCounts = {};
        var mBigWin = null, dBigWin = null;
        var mBigLoss = null, dBigLoss = null;

        rows.forEach(function(r) {
          var picker = (r[3] || '').trim();
          var correct = (r[12] || '').trim();
          var netUnits = parseFloat(r[15]) || 0;
          var netDollars = parseFloat(r[16]) || 0;
          var homePick = (r[6] || '').trim();
          var awayPick = (r[7] || '').trim();
          var game = (r[4] && r[5]) ? r[4] + ' vs ' + r[5] : '';

          [homePick, awayPick].filter(Boolean).forEach(function(player) {
            if (!pickCounts[player]) pickCounts[player] = { Maria: 0, Danielle: 0 };
            if (picker === 'Maria' || picker === 'Danielle') pickCounts[player][picker]++;
          });

          if (picker === 'Maria') {
            mTotal++;
            if (correct === 'Yes') mCorrect++;
            mUnits += netUnits;
            mDollars += netDollars;
            if (netUnits > 0 && (mBigWin === null || netUnits > mBigWin.units))
              mBigWin = { units: netUnits, dollars: netDollars, game: game };
            if (netUnits < 0 && (mBigLoss === null || netUnits < mBigLoss.units))
              mBigLoss = { units: netUnits, game: game };
          } else if (picker === 'Danielle') {
            dTotal++;
            if (correct === 'Yes') dCorrect++;
            dUnits += netUnits;
            dDollars += netDollars;
            if (netUnits > 0 && (dBigWin === null || netUnits > dBigWin.units))
              dBigWin = { units: netUnits, dollars: netDollars, game: game };
            if (netUnits < 0 && (dBigLoss === null || netUnits < dBigLoss.units))
              dBigLoss = { units: netUnits, game: game };
          }
        });

        var allPlayers = Object.keys(pickCounts).map(function(name) {
          return { name: name, total: pickCounts[name].Maria + pickCounts[name].Danielle, maria: pickCounts[name].Maria, danielle: pickCounts[name].Danielle };
        }).filter(function(p) { return p.total > 0; }).sort(function(a, b) { return b.total - a.total; });

        var mostOverall = allPlayers[0];
        var mariaMost = allPlayers.filter(function(p) { return p.maria > 0; }).sort(function(a, b) { return b.maria - a.maria; })[0];
        var danielleMost = allPlayers.filter(function(p) { return p.danielle > 0; }).sort(function(a, b) { return b.danielle - a.danielle; })[0];

        var winnerClass, winnerHtml;
        if (mUnits > dUnits) {
          winnerClass = 'maria-wins';
          winnerHtml = '<span class="winner-name">🏆 Maria wins 2025</span>+' + mUnits.toFixed(1) + 'u to Danielle\'s ' + dUnits.toFixed(1) + 'u';
        } else if (dUnits > mUnits) {
          winnerClass = 'danielle-wins';
          winnerHtml = '<span class="winner-name">🏆 Danielle wins 2025</span>+' + dUnits.toFixed(1) + 'u to Maria\'s ' + mUnits.toFixed(1) + 'u';
        } else {
          winnerClass = 'tied';
          winnerHtml = '<span class="winner-name">Tied</span>All square after the 2025 season.';
        }

        var mPct = mTotal ? Math.round(mCorrect / mTotal * 100) : 0;
        var dPct = dTotal ? Math.round(dCorrect / dTotal * 100) : 0;
        var mUnitStr = (mUnits >= 0 ? '+' : '') + mUnits.toFixed(1);
        var dUnitStr = (dUnits >= 0 ? '+' : '') + dUnits.toFixed(1);
        var mDolStr = (mDollars >= 0 ? '+$' : '-$') + Math.abs(mDollars).toFixed(2);
        var dDolStr = (dDollars >= 0 ? '+$' : '-$') + Math.abs(dDollars).toFixed(2);

        var funRows = '';
        if (mostOverall) funRows += '<div class="fun-row"><span class="fun-label">Most picked player overall</span><span class="fun-val">' + mostOverall.name + ' (' + mostOverall.total + 'x)</span></div>';
        if (mariaMost) funRows += '<div class="fun-row"><span class="fun-label">Maria\'s most picked player</span><span class="fun-val maria">' + mariaMost.name + ' (' + mariaMost.maria + 'x)</span></div>';
        if (danielleMost) funRows += '<div class="fun-row"><span class="fun-label">Danielle\'s most picked player</span><span class="fun-val danielle">' + danielleMost.name + ' (' + danielleMost.danielle + 'x)</span></div>';
        if (mBigWin) funRows += '<div class="fun-row"><span class="fun-label">Maria\'s biggest win</span><span class="fun-val maria">+' + mBigWin.units + 'u ($' + mBigWin.dollars + ') — ' + mBigWin.game + '</span></div>';
        if (dBigWin) funRows += '<div class="fun-row"><span class="fun-label">Danielle\'s biggest win</span><span class="fun-val danielle">+' + dBigWin.units + 'u ($' + dBigWin.dollars + ') — ' + dBigWin.game + '</span></div>';
        if (mBigLoss) funRows += '<div class="fun-row"><span class="fun-label">Maria\'s biggest loss</span><span class="fun-val red">' + mBigLoss.units + 'u — ' + mBigLoss.game + '</span></div>';
        if (dBigLoss) funRows += '<div class="fun-row"><span class="fun-label">Danielle\'s biggest loss</span><span class="fun-val red">' + dBigLoss.units + 'u — ' + dBigLoss.game + '</span></div>';

        document.getElementById('main-content').innerHTML =
          '<div class="winner-banner ' + winnerClass + '">' + winnerHtml + '</div>' +

          '<div class="section-label">Final Stats</div>' +
          '<div class="stat-grid">' +
            '<div class="stat-card"><div class="s-label">Units Won</div>' +
              '<div class="s-row"><span class="s-val maria">' + mUnitStr + 'u</span><span class="s-name">Maria</span></div>' +
              '<div class="s-row"><span class="s-val danielle">' + dUnitStr + 'u</span><span class="s-name">Danielle</span></div></div>' +
            '<div class="stat-card"><div class="s-label">Dollars Won</div>' +
              '<div class="s-row"><span class="s-val maria">' + mDolStr + '</span><span class="s-name">Maria</span></div>' +
              '<div class="s-row"><span class="s-val danielle">' + dDolStr + '</span><span class="s-name">Danielle</span></div></div>' +
            '<div class="stat-card"><div class="s-label">Correct Guesses</div>' +
              '<div class="s-row"><span class="s-val maria">' + mCorrect + '/' + mTotal + '</span><span class="s-name">Maria</span></div>' +
              '<div class="s-row"><span class="s-val danielle">' + dCorrect + '/' + dTotal + '</span><span class="s-name">Danielle</span></div></div>' +
            '<div class="stat-card"><div class="s-label">Accuracy</div>' +
              '<div class="s-row"><span class="s-val maria">' + mPct + '%</span><span class="s-name">Maria</span></div>' +
              '<div class="s-row"><span class="s-val danielle">' + dPct + '%</span><span class="s-name">Danielle</span></div></div>' +
          '</div>' +

          '<hr class="divider">' +
          '<div class="section-label">Fun Stats</div>' +
          '<div>' + funRows + '</div>';

      }).catch(function(e) {
        console.error(e);
        document.getElementById('main-content').innerHTML = '<div class="loading">Error loading data: ' + e.message + '</div>';
      });
    }

    init();
  </script>
</body>
</html>
